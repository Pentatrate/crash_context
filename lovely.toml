[manifest]
dump_lua = true
priority = 0
version = "1.0.0"

# Utilitools requirement ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== =====
[[patches]]
[patches.pattern]
match_indent = true
pattern = '''cs = bs.load(project.initState)'''
payload = '''
if mods.utilitools == nil then
	local buttonPressed = love.window.showMessageBox("Crash Context", "Beattools requires Utilitools. Please install that mod.", { "Ok", "No" })
	if buttonPressed == 2 then error("Beattools: This is what you get for not installing Utilitools even though this mod needs it") end
	love.quit()
	error("Beattools: Failed to quit game.")
end
utilitools.files.beattools.startup()
'''
position = "after"
target = "main.lua"
times = 1

# Crash context ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== =====
[[patches]]
[patches.pattern]
match_indent = true
pattern = '''local message = loc.get('crashBody')'''
payload = '''
local function getContext(contextAmount, level)
	if not utilitools then return "error: utilitools not loaded" end
	local pathInfos = utilitools.string.split(debug.traceback(), "\n")
	local pathInfo = pathInfos[level + 1]

	if not pathInfo then return "error: invalid level (" .. level .. "/" .. (#pathInfos - 1) .. ")" end
	local errorPos = utilitools.string.split(pathInfo:sub(2), ":")
	errorPos[1] = errorPos[1]:gsub("\\", "/")
	errorPos[2] = tonumber(errorPos[2])

	local dumpPath = "Mods/lovely/dump/" .. errorPos[1]
	local inDump = love.filesystem.getInfo(dumpPath)
	local filePath = inDump and dumpPath or errorPos[1]
	if not love.filesystem.getInfo(filePath) then return getContext(contextAmount, level + 1) end
	-- modlog(mods.beattools, errorPos[1] .. ":" .. errorPos[2] .. " (" .. level .. "/" .. (#pathInfos - 1) .. ")")

	local contents = love.filesystem.read(filePath)
	if type(contents) ~= "string" then return "error: file " .. filePath .. " not readable" end

	local lines = {}
	local context = {}
	for line in love.filesystem.lines(filePath) do
		table.insert(lines, line)
	end
	for i = math.max(1, errorPos[2] - contextAmount), math.min(#lines, errorPos[2] + contextAmount) do
		local prepend = "" -- i .. "\t"
		local append = ""
		if i == errorPos[2] then append = " <<<<< <<<<< HERE <<<<< <<<<<" end
		table.insert(context, prepend .. lines[i] .. append)
	end
	return "Context: " .. errorPos[1] .. ":" .. errorPos[2] .. ":\n" .. table.concat(context, "\n")
end
if modlog then modlog(mods.beattools, getContext(mods.crash_context.config.surroundingLines, 3)) end'''
position = "after"
target = "main.lua"
